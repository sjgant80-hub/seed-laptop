name: gate
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: the blocks are the pinned upstream bytes (locally, and fetched again from GitHub at each commit)
        run: node tools/vendor-blocks.mjs --check && node tools/vendor-blocks.mjs --remote
      - name: the stock seed opens under the pinned key and carries exactly those blocks
        run: node tools/make-seed.mjs --check
      - name: the office's offline list names exactly the files it has now
        run: node tools/build-office.mjs --check
      - name: unit, pin and hostile-input suites (G1 fuzz included)
        run: node --test test/*.test.mjs
      - name: plant the stock seed with no network permission (the planting cannot reach the network)
        run: |
          mkdir -p .out/ci-home
          SEED_PHRASE="a public CI owner phrase, not a secret" node --permission --allow-fs-read="$PWD" --allow-fs-read="$PWD/*" --allow-fs-write="$PWD/.out/ci-home/*" tools/plant.mjs --seed seeds/stock.full --home .out/ci-home
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: mutation gate over every kernel, no unreviewed survivors, nothing capped (G1)
        run: node witness-all.mjs
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the minimal base from its pinned definition
        run: docker build -f base/Containerfile -t seed-base .
      - name: the runtime probe, inside the base, with no network at all
        run: docker run --rm --network none --read-only seed-base node tools/probe.mjs --json | tee probe.json
      - name: plant the full seed INSIDE the base, no network device at all, root filesystem read-only
        run: |
          docker run --rm --network none --read-only --tmpfs /home/node/office:uid=1000,gid=1000 -e SEED_PHRASE="a public CI owner phrase, not a secret" seed-base             node --permission --allow-fs-read=/plant --allow-fs-read='/plant/*' --allow-fs-read='/home/node/office/*' --allow-fs-write='/home/node/office/*' tools/plant.mjs --seed seeds/stock.full --home /home/node/office/h | tee plant.json
          grep -q '"ok":true' plant.json
      - name: what is in the base, exactly (refused if it differs from base/MANIFEST.json)
        run: |
          docker run --rm --network none seed-base node tools/base-manifest.mjs > manifest.json
          if [ -f base/MANIFEST.json ]; then diff base/MANIFEST.json manifest.json && echo "base matches its manifest"; else cat manifest.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: base-manifest
          path: |
            manifest.json
            probe.json
            plant.json
