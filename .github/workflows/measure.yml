name: measure
# The measurements that must happen on GitHub's runner, each dispatched by hand once (job: l3, l6, l6b or l3b); their receipts are downloaded and
# committed exactly as they came (claim L3's mainstream readers, claim L6's capture from below).
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'which measurement to run (each is run once): l3, l6, l6b or l3b'
        required: true
        type: choice
        options: [l3, l6, l6b, l3b]
jobs:
  l3-readers:
    if: inputs.job == 'l3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: the tested readers (LibreOffice and poppler from Ubuntu; the Python readers from PyPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc poppler-utils
          python3 -m pip install --quiet pymupdf pypdf python-docx openpyxl icalendar
          soffice --version; pdftotext -v 2>&1 | head -1
      - name: write the six files, scan them, open them in every reader
        run: node measure/l3.mjs ci
      - uses: actions/upload-artifact@v4
        with:
          name: l3-ci
          path: receipts/l3-ci.json
          if-no-files-found: error
  l6-netns:
    if: inputs.job == 'l6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: tcpdump and iproute2
        run: sudo apt-get update && sudo apt-get install -y tcpdump iproute2
      - name: the sealed day inside a locked network namespace, captured from below
        run: |
          sudo env "PATH=$PATH" bash measure/netns-day.sh out
          sudo chown -R "$(id -u):$(id -g)" out
      - name: read the capture (airgap-prover's egress kernel) against the day's send windows
        run: node measure/l6.mjs ci out
      - uses: actions/upload-artifact@v4
        with:
          name: l6-ci
          path: |
            receipts/l6-ci.json
            out/day.pcap
            out/day.json
          if-no-files-found: error
  l6b-netns:
    # claim L6b (measure/claims-b.json): the same day, captured from below in the direction the guest sends only
    if: inputs.job == 'l6b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: tcpdump and iproute2
        run: sudo apt-get update && sudo apt-get install -y tcpdump iproute2
      - name: the sealed day inside a locked network namespace, only what the guest sends captured from below
        run: |
          sudo env "PATH=$PATH" bash measure/netns-day.sh out outbound
          sudo chown -R "$(id -u):$(id -g)" out
      - name: read the capture (airgap-prover's egress kernel) against the day's send windows
        run: node measure/l6.mjs ci-b out
      - uses: actions/upload-artifact@v4
        with:
          name: l6b-ci
          path: |
            receipts/l6b-ci.json
            out/day.pcap
            out/day.json
          if-no-files-found: error
  l3b-readers:
    # claim L3b (measure/claims-e.json): L3 again, read with its two corrections
    if: inputs.job == 'l3b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: the tested readers (LibreOffice and poppler from Ubuntu; the Python readers from PyPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc poppler-utils
          python3 -m pip install --quiet pymupdf pypdf python-docx openpyxl icalendar
          soffice --version; pdftotext -v 2>&1 | head -1
      - name: write the six files, scan them, open them in every reader
        run: node measure/l3.mjs ci-b
      - uses: actions/upload-artifact@v4
        with:
          name: l3b-ci
          path: receipts/l3b-ci.json
          if-no-files-found: error
